# Metric hardware design dimensions (mm) for 3D-printed parts — rendered by
# _includes/hardware-chart.html on /hardware-design/. Source: alch.shop's
# hardware design boards. One entry per bolt size; keys map to chart rows.
#   nut_press / nut_slip   hex nut pocket, across flats
#   nut_thick              hex nut thickness = pocket depth
#   head_press / head_slip hex head bolt pocket, across flats. Set from the
#                          measured heads with the nut pockets' clearances
#                          (press ≈ +0.1, slip ≈ +0.4); heads measure ~0.07
#                          wider than the nuts, so these run 0.1 over nut_*.
#   head_depth             pocket depth ≈ measured head height + 0.2. Heads
#                          measure 0.2–0.4 taller than DIN 933 nominal.
#                          M3 is extrapolated (no M3 bolt measured).
#   sq_press / sq_slip     square nut pocket width
#   sq_thick               square nut slip thickness = pocket depth / slot width
#   sq_vert                square nut vertical slot width and depth
#   bolt_slip              bolt clearance hole
#   cb_dia / cb_depth      counterbore
#   cs_dia / cs_depth      countersink (chamfer is computed)
#   washer_dia / washer_thick
#
# Each size also carries a `measured` block: caliper readings of the actual
# parts on hand, blank until measured. The fit values above are the source of
# truth and are what the page shows; `measured` is reference so the real
# clearance (fit − measured) can be checked, and a fit adjusted when a part
# turns out to run off its standard. Nothing on the page reads it.
- name: M3
  nut_press: 5.5
  nut_slip: 5.7
  nut_thick: 2.5
  head_press: 5.6
  head_slip: 5.8
  head_depth: 2.4
  sq_press: 5.4
  sq_slip: 5.8
  sq_thick: 2.1
  sq_vert: 6.3
  bolt_slip: 3.3
  cb_dia: 5.6
  cb_depth: 3.1
  cs_dia: 6.3
  cs_depth: 2.1
  washer_dia: 7.3
  washer_thick: 0.6
  measured:            # mm, blank until measured
    nut_flats: 5.45        # hex nut across flats
    nut_thick: 2.35
    head_flats:        # hex head bolt across flats
    head_height:
    sq_width:          # square nut
    sq_thick:
    bolt_dia:          # thread major Ø
    cap_head_dia:      # socket head cap screw (counterbore)
    cap_head_height:
    csk_head_dia:      # countersunk screw (countersink)
    csk_head_height:
    washer_dia:
    washer_thick:
