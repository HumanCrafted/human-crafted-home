# Made — store-wide settings.
# Everything the shop needs that isn't per-product lives here. Edit this file
# and the cart, catalog and checkout all follow.

currency: USD
symbol: "$"

# Orders at or above this subtotal ship free. Set to null to always charge.
free_shipping_over: 75

# Flat shipping rates by region. The shopper picks a region on /cart/ before
# checkout; the checkout function then offers Stripe exactly one rate and
# restricts the address form to that region's `countries` (ISO 3166-1 codes).
# Stripe's hosted page can't vary the rate by address on its own, which is why
# the region is chosen up front. A region with no `countries` can't be checked
# out — it stays listed on /cart/ but the function refuses it.
# `code` is what the cart submits — don't rename one without the other.
# A cart of only digital items skips shipping entirely.
shipping:
  - code: US
    region: United States
    rate: 8.00
    note: 3–5 business days
    countries: [US]
# US only for launch (Sept 2026). The $8 flat rate is the middle of USPS
# Ground Advantage commercial rates from Evansville for the 2 lb tier
# (Chicago $5.90 · Denver $7.09 · Los Angeles $8.27, Sept 2026) plus about a
# dollar for the box; orders over free_shipping_over ship free. Alaska and
# Hawaii are included under US — Stripe can't exclude states, so those rare
# labels cost a few dollars more. To reopen a region, uncomment it:
#  - code: CA
#    region: Canada
#    rate: 16.00
#    note: 7–14 business days
#    countries: [CA]
#  - code: INTL
#    region: Everywhere else
#    rate: 28.00
#    note: 10–21 business days, duties not included
#    # Quote "NO" (Norway): unquoted, YAML reads it as the boolean false.
#    countries: [GB, IE, FR, DE, NL, BE, ES, IT, PT, AT, CH, DK, SE, "NO", FI, AU, NZ, JP, SG, KR, MX]

# Sales tax is Stripe's job: set STRIPE_TAX=1 on the checkout function once
# Stripe Tax is switched on in the Dashboard. The cart shows "at checkout".

# Below this remaining stock a variant shows a "only N left" nudge.
low_stock_at: 5
